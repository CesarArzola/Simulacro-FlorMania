<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlorManía</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <header>
        <div class="top-nav">
            <div class="logo">
                <span class="flor">Flor</span><span class="mania">Manía</span>
            </div>
            <div class="nav-links">
                <a href="#" id="envia-flores">Envía Flores</a>
                <a href="#">Nosotros</a>
                <button id="iniciar-sesion">Iniciar Sesión</button>
            </div>
        </div>
        <div class="bottom-nav">
            <a href="#">Girasoles</a>
            <a href="#">Rosas</a>
            <a href="#">Claveles</a>
            <a href="#">Tulipanes</a>
            <a href="#">Orquídeas</a>
            <a href="#">Margaritas</a>
        </div>
    </header>

    <main>
        <section class="flor-del-mes">
            <h2>Flor del Mes</h2>
            <div class="imagen-principal-placeholder">
                <img src="static/img/flor-del-mes.jfif" alt="Flor del mes">
            </div>
        </section>

        <section class="productos">
            <div class="productos-header">
                <span class="resultados">Mostrando <strong>50 resultados</strong></span>
                <a href="#" class="ver-mas">Ver más Flores</a>
            </div>

            <div class="grid-productos">
                <div class="producto-card">
                    <div class="imagen-producto-placeholder">
                        <img src="static/img/Ramo-de-rosas.jfif" alt="Ramo de rosas">
                    </div>
                    <div class="info-producto">
                        <div class="texto-producto">
                            <span class="nombre">Ramo de Rosas</span>
                            <span class="precio">$40.00</span>
                        </div>
                        <button class="btn-comprar">Comprar</button>
                    </div>
                </div>

                <div class="producto-card">
                    <div class="imagen-producto-placeholder">
                        <img src="static/img/arreglo-tulipanes.jfif" alt="Arreglo tulipanes">
                    </div>
                    <div class="info-producto">
                        <div class="texto-producto">
                            <span class="nombre">Arreglo Tulipanes</span>
                            <span class="precio">$50.00</span>
                        </div>
                        <button class="btn-comprar">Comprar</button>
                    </div>
                </div>

                <div class="producto-card">
                    <div class="imagen-producto-placeholder">
                        <img src="static/img/bouquet-lirios.jfif" alt="Bouquets lirios">
                    </div>
                    <div class="info-producto">
                        <div class="texto-producto">
                            <span class="nombre">Bouquet Lirios</span>
                            <span class="precio">$25.00</span>
                        </div>
                        <button class="btn-comprar">Comprar</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
